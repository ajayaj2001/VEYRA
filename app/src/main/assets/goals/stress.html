<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0}body,html{background:transparent;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}svg{width:64px;height:64px}@keyframes breathe{0%,100%{transform:scale(.85);opacity:.4}50%{transform:scale(1.15);opacity:.9}}@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}.br{transform-origin:30px 30px;animation:breathe 4s ease-in-out infinite}.sp{transform-origin:30px 30px;animation:spin 20s linear infinite}</style></head><body>
<svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
<circle class="br" cx="30" cy="30" r="20" fill="#8E8E93" fill-opacity=".06"/>
<circle class="br" cx="30" cy="30" r="14" stroke="#8E8E93" stroke-width="1.5" opacity=".3"/>
<circle cx="30" cy="30" r="8" stroke="#8E8E93" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" class="sp"/>
<circle cx="30" cy="30" r="3" fill="#8E8E93" opacity=".5"/>
<circle class="br" cx="30" cy="30" r="1.5" fill="#8E8E93"/>
</svg>
</body></html>
