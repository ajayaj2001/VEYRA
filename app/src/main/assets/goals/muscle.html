<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0}body,html{background:transparent;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}svg{width:64px;height:64px}@keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.8;transform:scale(1.2)}}@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.p1{transform-origin:center;animation:pulse 1.5s ease-in-out infinite}.p2{transform-origin:center;animation:pulse 1.5s ease-in-out infinite .3s}.p3{transform-origin:center;animation:pulse 1.5s ease-in-out infinite .6s}.db{animation:lift 2s ease-in-out infinite}</style></head><body>
<svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
<g class="db">
<rect x="12" y="26" width="36" height="4" rx="2" fill="#2EC4A0"/>
<rect x="8" y="22" width="6" height="12" rx="2" fill="#2EC4A0" opacity=".7"/>
<rect x="46" y="22" width="6" height="12" rx="2" fill="#2EC4A0" opacity=".7"/>
<rect x="4" y="24" width="5" height="8" rx="2" fill="#2EC4A0" opacity=".5"/>
<rect x="51" y="24" width="5" height="8" rx="2" fill="#2EC4A0" opacity=".5"/>
</g>
<line class="p1" x1="20" y1="16" x2="20" y2="12" stroke="#2EC4A0" stroke-width="1.5" stroke-linecap="round"/>
<line class="p2" x1="30" y1="14" x2="30" y2="10" stroke="#2EC4A0" stroke-width="1.5" stroke-linecap="round"/>
<line class="p3" x1="40" y1="16" x2="40" y2="12" stroke="#2EC4A0" stroke-width="1.5" stroke-linecap="round"/>
</svg>
</body></html>
