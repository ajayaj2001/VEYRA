<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0}body,html{background:transparent;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}svg{width:64px;height:64px}@keyframes steam1{0%,100%{opacity:0;transform:translateY(0) scaleX(1)}30%{opacity:.7}70%{opacity:.4}100%{transform:translateY(-14px) scaleX(.6)}}@keyframes steam2{0%,100%{opacity:0;transform:translateY(0) scaleX(1)}30%{opacity:.5}70%{opacity:.3}100%{transform:translateY(-12px) scaleX(.5)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}.s1{animation:steam1 2.5s ease-in-out infinite}.s2{animation:steam2 2.5s ease-in-out infinite .5s}.s3{animation:steam1 2.5s ease-in-out infinite 1s}.bw{animation:bob 3s ease-in-out infinite}</style></head><body>

</svg>
</body></html>
