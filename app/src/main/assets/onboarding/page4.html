<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="illustration.css">
  <link rel="stylesheet" href="page4.css">
</head>
<body>
  <div class="illustration" aria-hidden="true">
    <img alt="" src="art/nutrition-frame.svg" style="position:absolute; display:block; inset:0; width:100%;height:100%">
    <div data-layer="Plate" style="position:absolute; inset:24.82% 23.45% 18.98% 23.45%">
      <img alt="" src="art/nutrition-plate.svg" style="position:absolute; display:block; inset:0; width:100%;height:100%">
    </div>
    <div data-layer="Leaves" style="position:absolute; inset:31.39% 36.55% 30.29% 32.33%">
      <div style="position:absolute; inset:0 0 -1.43% 0">
        <img alt="" src="art/nutrition-leaves.svg" style="display:block; width:100%;height:100%">
      </div>
    </div>
    <div data-layer="Fruit" style="position:absolute; display:contents; inset:38.16% 33.79% 39.78% 48.14%">
      <div data-layer="Fruit-upper" style="position:absolute; inset:38.16% 33.79% 45.57% 51.8%">
        <img alt="" src="art/nutrition-fruit-upper.svg" style="position:absolute; display:block; inset:0; width:100%;height:100%">
      </div>
      <div data-layer="Fruit-lower" style="position:absolute; inset:47.77% 39.13% 39.78% 48.14%">
        <img alt="" src="art/nutrition-fruit-lower.svg" style="position:absolute; display:block; inset:0; width:100%;height:100%">
      </div>
    </div>
    <div data-layer="Grains" style="position:absolute; inset:57.69% 49.33% 26.88% 32.08%">
      <img alt="" src="art/nutrition-grains.svg" style="position:absolute; display:block; inset:0; width:100%;height:100%">
    </div>
    <div style="position:absolute; height:226.2777557373047px; inset:10.7% 14.75% 12.04% 10%; overflow:visible; width:233.28306579589844px">
      <div data-motion="2:6924" data-layer="Macro arcs" style="position:relative; width:100%;height:100%">
        <div data-layer="Macro-teal" style="position:absolute; inset:calc(10.7% - 24.21px) calc(36.55% - 17.68px) calc(29.93% - 15.34px) calc(10% - 23.33px)">
          <div style="position:absolute; inset:-1.54% -1.61%">
            <img alt="" src="art/nutrition-macro-teal.svg" style="display:block; width:100%;height:100%">
          </div>
        </div>
        <div data-layer="Macro-orange" style="position:absolute; inset:calc(28.47% - 12.38px) calc(14.75% - 34.4px) calc(12.04% - 27.25px) calc(62.07% + 16.62px)">
          <div style="position:absolute; inset:-1.53% -3.72%">
            <img alt="" src="art/nutrition-macro-orange.svg" style="display:block; width:100%;height:100%">
          </div>
        </div>
        <div data-layer="Macro-amber" style="position:absolute; inset:calc(29.93% - 11.41px) calc(48.97% - 8.15px) calc(14.6% - 25.55px) calc(19.27% - 16.22px)">
          <div style="position:absolute; inset:-1.32% -2.17%">
            <img alt="" src="art/nutrition-macro-amber.svg" style="display:block; width:100%;height:100%">
          </div>
        </div>
      </div>
    </div>
    <div data-motion="2:6935" data-layer="Traveling dots" style="position:absolute; inset:10.77% 34.31% 9.67% 26.21%">
      <div style="position:absolute; inset:-0.69% -1.31%">
        <img alt="" src="art/nutrition-traveling-dots.svg" style="display:block; width:100%;height:100%">
      </div>
    </div>
    <div data-motion="2:6939" data-layer="Sparkle" style="position:absolute; inset:15.69% 46.55% 77.01% 46.55%">
      <img alt="" src="art/nutrition-sparkle.svg" style="position:absolute; display:block; inset:0; width:100%;height:100%">
    </div>
  </div>
  <script src="illustration.js"></script>
</body>
</html>
