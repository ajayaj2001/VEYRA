<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0}body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}svg{width:280px;height:280px}@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes counter{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:.45}}.orbit{transform-origin:150px 150px;animation:spin 32s linear infinite}.node{animation:counter 32s linear infinite}.halo{transform-origin:150px 150px;animation:pulse 3.5s ease-in-out infinite}</style></head><body>

</body></html>
