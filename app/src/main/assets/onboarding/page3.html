<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0}body{background:transparent;display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden;margin:0;padding:0}svg{width:280px;height:280px}@keyframes df{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes so{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes ap{0%,100%{stroke-dashoffset:-10;opacity:.9}50%{stroke-dashoffset:-20;opacity:1}}@keyframes pd{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.15);opacity:1}}@keyframes bb{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.08)}}@keyframes an{0%,100%{transform:translate(0,0)}50%{transform:translate(1.5px,-2.5px)}}@keyframes ag{0%,100%{opacity:.04;transform:scale(1)}50%{opacity:.08;transform:scale(1.04)}}.db{animation:df 3.6s ease-in-out infinite;transform-origin:140px 140px}.ob{animation:so 28s linear infinite;transform-origin:140px 140px}.ac{animation:ap 3.8s ease-in-out infinite;transform-origin:140px 140px}.dt{animation:pd 2.4s ease-in-out infinite;transform-origin:202px 140px}.b1{animation:bb 2.8s ease-in-out infinite;transform-origin:197px 100px;animation-delay:.1s}.b2{animation:bb 2.8s ease-in-out infinite;transform-origin:207px 100px;animation-delay:.25s}.b3{animation:bb 2.8s ease-in-out infinite;transform-origin:217px 100px;animation-delay:.4s}.b4{animation:bb 2.8s ease-in-out infinite;transform-origin:227px 100px;animation-delay:.55s}.aw{animation:an 2.8s ease-in-out infinite;transform-origin:212px 55px}.gl{animation:ag 4s ease-in-out infinite;transform-origin:140px 140px}</style></head><body>
