name: Android build

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      - name: Test and build APKs
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: aura-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: aura-release-unsigned-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
      - name: Publish latest milestone release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "build-${GITHUB_RUN_NUMBER}"
          app/build/outputs/apk/debug/app-debug.apk#AURA-debug-installable.apk
          app/build/outputs/apk/release/app-release-unsigned.apk#AURA-release-unsigned.apk
          --repo "${GITHUB_REPOSITORY}"
          --title "AURA milestone build ${GITHUB_RUN_NUMBER}"
          --notes "Automated milestone build from ${GITHUB_SHA}. The debug APK is installable. The release APK is unsigned until production signing is configured."
          --latest
